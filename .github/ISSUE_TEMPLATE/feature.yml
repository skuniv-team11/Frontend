name: 기능
description: 기능 추가, 리팩토링, 문서 작업을 이슈로 만든다
title: ""
labels: []
body:
  - type: textarea
    id: description
    attributes:
      label: 📌 기능 설명
      description: 무엇을 왜 하는지 한두 줄로 적는다
      placeholder: 팀원이 같은 규칙으로 작업할 수 있도록 README에 Git 규칙을 정리함
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 🛠 작업 내용
      description: 바꿀 파일과 내용을 적는다
      value: |
        - [x] `파일 경로` — 작업 내용
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: 💬 참고 사항
      description: 관련 결정, 확인이 필요한 점
    validations:
      required: false